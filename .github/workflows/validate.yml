name: Validate scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The scripts' floor is Python 3.12, reached as python3 from PowerShell, as skills and hooks invoke it.
      - name: Check python3 is the minimum version
        run: python3 -c "import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 12))"
      - name: Check skill installation, migration and MCP installation with mocked CLIs
        run: python3 -m unittest discover -v -s tests -t .
      - name: Check the pull-request scripts with a mocked gh
        run: python3 -m unittest discover -v -s skills/pull-request/tests -t skills/pull-request
      - name: Check orchestration scripts and hooks
        run: python3 -m unittest discover -v -s skills/agent-orchestration/tests -t skills/agent-orchestration
      - name: Check the control layer's script and hooks
        run: python3 -m unittest discover -v -s skills/control-attach/tests -t skills/control-attach
      - name: Check orchestration threads
        run: python3 -m unittest discover -v -s skills/orchestration-main/tests -t skills/orchestration-main
      - name: Check the eval runner and its helpers
        run: python3 -m unittest discover -v -s scripts/tests -t scripts
      - name: Check the tt session scanner
        run: python3 -m unittest discover -v -s skills/tt/tests -t skills/tt
      - name: Check model-council scripts
        run: python3 -m unittest discover -v -s skills/model-council/tests -t skills/model-council
      - name: Check status line
        run: python3 -m unittest discover -v -s statusline/tests -t statusline
