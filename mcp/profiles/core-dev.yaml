version: 1
id: core-dev
name: core-dev
servers:
  - type: remote
    secrets: default
    endpoint: https://learn.microsoft.com/api/mcp
    snapshot:
      server:
        name: docs-microsoft
        type: remote
        description: Search and read official Microsoft Learn documentation.
        remote:
          url: https://learn.microsoft.com/api/mcp
          transport_type: streamable-http
  - type: remote
    secrets: default
    endpoint: https://mcp.context7.com/mcp
    snapshot:
      server:
        name: context7
        type: remote
        description: Retrieve current, version-specific library documentation and examples.
        remote:
          url: https://mcp.context7.com/mcp
          transport_type: streamable-http
  - type: image
    secrets: default
    image: local/mcp-material-ui:0.1.4
    snapshot:
      server:
        name: material-ui
        type: server
        description: Search Material UI documentation and component APIs.
        image: local/mcp-material-ui:0.1.4
        remote: {}
  - type: remote
    secrets: default
    endpoint: https://mcp.agentmail.to/mcp
    snapshot:
      server:
        name: agent-mail
        type: remote
        description: Use AgentMail test inboxes to verify application email flows.
        remote:
          url: https://mcp.agentmail.to/mcp
          transport_type: streamable-http
          headers:
            x-api-key: ${AGENTMAIL_API_KEY}
        secrets:
          - name: agentmail.api_key
            env: AGENTMAIL_API_KEY
  - type: image
    secrets: default
    image: mcp/firecrawl@sha256:28e677a10704596526b1fbeb8105d1930cc7500648433216ce6937e03b20516c
    snapshot:
      server:
        name: firecrawl
        type: server
        description: Search, scrape, crawl, and extract structured data from the web.
        image: mcp/firecrawl@sha256:28e677a10704596526b1fbeb8105d1930cc7500648433216ce6937e03b20516c
        remote: {}
        secrets:
          - name: firecrawl.api_key
            env: FIRECRAWL_API_KEY
  - type: remote
    secrets: default
    endpoint: https://mcp-docs.docker.com/mcp
    snapshot:
      server:
        name: docker-docs
        type: remote
        description: Search and retrieve official Docker documentation.
        remote:
          url: https://mcp-docs.docker.com/mcp
          transport_type: streamable-http
  - type: image
    secrets: default
    image: mcp/playwright@sha256:8771dc4666e7c11440bfc6a0c6b00480e9a15b8891b45f29a52d7d995f8d1492
    snapshot:
      server:
        name: playwright
        type: server
        description: Automate browser interactions with Playwright.
        image: mcp/playwright@sha256:8771dc4666e7c11440bfc6a0c6b00480e9a15b8891b45f29a52d7d995f8d1492
        remote: {}
  - type: image
    secrets: default
    image: ghcr.io/github/github-mcp-server@sha256:46cdbbd810faf6f7aed1745ea04057443f5cb9fcadc15c7308add18cf9a83e33
    snapshot:
      server:
        name: github-official
        type: server
        description: Use GitHub's official catalog-default MCP toolset for repositories, issues, pull requests, and reviews.
        image: ghcr.io/github/github-mcp-server@sha256:46cdbbd810faf6f7aed1745ea04057443f5cb9fcadc15c7308add18cf9a83e33
        remote: {}
        oauth:
          providers:
            - provider: github
              secret: github.personal_access_token
              env: GITHUB_PERSONAL_ACCESS_TOKEN
        secrets:
          - name: github.personal_access_token
            env: GITHUB_PERSONAL_ACCESS_TOKEN
        allowHosts:
          - api.github.com:443
          - github.com:443
          - raw.githubusercontent.com:443
secrets:
  default:
    provider: docker-desktop-store
