version: 1
id: envative
name: envative
servers:
  - type: image
    secrets: default
    image: local/mcp-azure-devops:2.9.0
    snapshot:
      server:
        name: azure-devops
        type: server
        description: Work with Envative Azure DevOps projects, work items, repositories, and search.
        image: local/mcp-azure-devops:2.9.0
        remote: {}
        secrets:
          - name: azure-devops.pat
            env: ADO_MCP_AUTH_TOKEN
  - type: remote
    secrets: default
    endpoint: https://api.harvestapp.com/mcp
    snapshot:
      server:
        name: harvest-time
        type: remote
        description: Read and manage Envative Harvest time entries.
        remote:
          url: https://api.harvestapp.com/mcp
          transport_type: streamable-http
  - type: remote
    secrets: default
    endpoint: https://estimator.devenvative.com/api/mcp
    snapshot:
      server:
        name: estimator
        type: remote
        description: Access the Envative estimator service through its hosted MCP endpoint.
        remote:
          url: https://estimator.devenvative.com/api/mcp
          transport_type: streamable-http
  - type: image
    secrets: default
    image: local/mcp-envative-kb:1.6.0
    snapshot:
      server:
        name: envative-kb
        type: server
        description: Query the Envative knowledge base through AWS Bedrock AgentCore.
        image: local/mcp-envative-kb:1.6.0
        remote: {}
        secrets:
          - name: envative-kb.aws_access_key_id
            env: AWS_ACCESS_KEY_ID
          - name: envative-kb.aws_secret_access_key
            env: AWS_SECRET_ACCESS_KEY
        env:
          - name: AWS_REGION
            value: "{{envative-kb.aws_region}}"
        config:
          - name: envative-kb
            description: Configure the Envative knowledge-base proxy
            type: object
            properties:
              aws_region:
                type: string
            required:
              - aws_region
  - type: image
    secrets: default
    image: local/mcp-aws-mcp:1.6.4
    snapshot:
      server:
        name: aws-mcp
        type: server
        description: Access AWS documentation, skills, and APIs through the managed AWS MCP Server using approved host profiles.
        image: local/mcp-aws-mcp:1.6.4
        remote: {}
        volumes:
          - "{{aws-mcp.aws_config_dir}}:/root/.aws:ro"
        env:
          - name: AWS_MCP_PROXY_PROFILES
            value: "{{aws-mcp.aws_profiles}}"
        config:
          - name: aws-mcp
            description: Configure AWS MCP access through host AWS CLI profiles
            type: object
            properties:
              aws_config_dir:
                type: string
              aws_profiles:
                type: string
            required:
              - aws_config_dir
              - aws_profiles
secrets:
  default:
    provider: docker-desktop-store
